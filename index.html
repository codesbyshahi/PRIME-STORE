<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAHI HOODIES — Premium Streetwear</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#F8F7F4;color:#1a1a1a;overflow-x:hidden;font-weight:400}
button,input,select,textarea{font-family:inherit}
a{text-decoration:none;color:inherit}
.pf{font-family:'Playfair Display',Georgia,serif}

:root{--g:#1B4332;--gl:#D8F3DC;--gm:#52B788;--dk:#0D1B0E;--tx:#4A4A4A;--txl:#8A8A8A;--bd:#E5E2DB;--bg:#F8F7F4;--w:#FFFFFF;--cream:#FAF6F0;--gold:#C8A96E;--red:#C0392B}

/* Announcement */
.ann{background:var(--dk);color:var(--gold);text-align:center;padding:10px 16px;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(248,247,244,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.nav-in{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{border:none;background:none;cursor:pointer;display:flex;align-items:baseline;gap:6px}
.logo b{font-family:'Playfair Display',serif;font-size:26px;color:var(--dk);letter-spacing:2px}
.logo small{font-size:7px;letter-spacing:5px;font-weight:700;color:var(--g);text-transform:uppercase;opacity:.6}
.nl{border:none;background:none;color:var(--tx);padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.nl:hover,.nl.on{background:var(--gl);color:var(--g)}
.nr{display:flex;align-items:center;gap:6px}
.sb{display:flex;align-items:center;gap:8px;background:var(--cream);border:1px solid var(--bd);border-radius:28px;padding:9px 18px}
.sb input{border:none;background:none;outline:none;font-size:13px;width:120px;color:var(--dk);font-weight:500}
.ib{position:relative;border:none;background:none;cursor:pointer;padding:8px;font-size:18px;border-radius:10px;transition:all .2s}
.ib:hover{background:var(--cream)}
.bdg{position:absolute;top:2px;right:2px;font-size:7px;font-weight:800;min-width:16px;height:16px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;padding:0 4px}
.btn{padding:12px 28px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .25s;letter-spacing:.3px}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn-g{background:var(--g);color:#fff}
.btn-dk{background:var(--dk);color:#fff}
.btn-o{background:none;border:2px solid var(--dk);color:var(--dk)}
.btn-o:hover{background:var(--dk);color:#fff}
.btn-sm{padding:8px 18px;font-size:12px;border-radius:8px}
.btn-gold{background:var(--gold);color:#fff}
.btn-w{background:#fff;color:var(--g)}

/* Dropdown */
.dd{position:absolute;top:100%;right:0;margin-top:8px;background:var(--w);border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.12);border:1px solid var(--bd);overflow:hidden;z-index:55;min-width:200px}
.dd button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 18px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--tx);text-align:left;font-weight:500;transition:background .15s}
.dd button:hover{background:var(--cream)}

/* Hero */
.hero{position:relative;overflow:hidden;min-height:520px;display:flex;align-items:center}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(13,27,14,.85),rgba(27,67,50,.6))}
.hero-in{max-width:1200px;margin:0 auto;padding:60px 24px;position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:48px;align-items:center;width:100%}
.hero-txt{flex:1;min-width:320px;color:#fff}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,169,110,.2);border:1px solid rgba(200,169,110,.3);color:var(--gold);font-size:11px;font-weight:700;padding:7px 16px;border-radius:24px;margin-bottom:24px;letter-spacing:1.5px;text-transform:uppercase}
.hero h1{font-family:'Playfair Display',serif;font-size:56px;line-height:1.05;margin-bottom:16px;font-weight:900;letter-spacing:-1px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:16px;margin-bottom:32px;max-width:420px;line-height:1.7;opacity:.8;font-weight:300}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.hero-cats{display:flex;gap:18px;margin-top:40px;align-items:center}
.hero-cats>span{font-size:11px;font-weight:600;opacity:.5;letter-spacing:1px;text-transform:uppercase}
.cc{display:flex;flex-direction:column;align-items:center;gap:7px;border:none;background:none;cursor:pointer;transition:transform .3s}
.cc:hover{transform:translateY(-4px)}
.cc img{width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.4);object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.2);transition:all .3s}
.cc:hover img{border-color:var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.3)}
.cc em{font-style:normal;font-size:11px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.5px}
.hero-visual{flex:0 0 320px;position:relative}
.hero-visual>img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:20px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.fl{position:absolute;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.1)}

/* Section */
.sec{max-width:1200px;margin:0 auto;padding:48px 24px}
.sec-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.sec-lab{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.sec-h{font-family:'Playfair Display',serif;font-size:32px;color:var(--dk);margin-top:6px;font-weight:700}

/* Product Card */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.pscroll{display:flex;gap:20px;overflow-x:auto;padding-bottom:16px;scroll-behavior:smooth;-ms-overflow-style:none;scrollbar-width:none}
.pscroll::-webkit-scrollbar{display:none}
.pscroll .pcard{flex-shrink:0;width:250px}
.pcard{cursor:pointer;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.pcard:hover{transform:translateY(-6px)}
.pcard .iw{position:relative;overflow:hidden;border-radius:16px;margin-bottom:14px;background:var(--cream)}
.pcard .iw img{width:100%;aspect-ratio:3/4;object-fit:cover;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.pcard:hover .iw img{transform:scale(1.06)}
.pcard .tg{position:absolute;top:12px;left:12px;color:#fff;font-size:9px;font-weight:800;padding:5px 10px;border-radius:8px;letter-spacing:.5px;backdrop-filter:blur(4px)}
.pcard .wb{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.08);font-size:15px;transition:all .2s}
.pcard .wb:hover{transform:scale(1.15);background:#fff}
.pcard .qv{position:absolute;bottom:12px;left:12px;right:12px;opacity:0;transform:translateY(8px);transition:all .3s}
.pcard:hover .qv{opacity:1;transform:translateY(0)}
.pcard .lb{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gm)}
.pcard .nm{font-size:15px;font-weight:600;color:var(--dk);margin-top:4px;line-height:1.3}
.pcard .pr{display:flex;align-items:center;gap:8px;margin-top:6px}
.pcard .pr b{font-size:16px;color:var(--dk)}
.pcard .pr s{font-size:12px;color:var(--txl);font-weight:400}
.pcard .sr{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:10px;color:var(--txl)}

/* Category */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ccard{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:3/4;border:none;cursor:pointer;width:100%;transition:transform .3s}
.ccard:hover{transform:translateY(-4px)}
.ccard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ccard:hover img{transform:scale(1.05)}
.ccard .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 60%)}
.ccard h3{position:absolute;bottom:0;left:0;right:0;padding:24px}
.ccard h3 b{font-family:'Playfair Display',serif;font-size:20px;color:#fff;display:block}
.ccard h3 small{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;display:block;font-weight:500;letter-spacing:.5px}

/* About */
.about-sec{background:var(--dk);border-radius:24px;padding:56px 48px;margin:0 24px;position:relative;overflow:hidden;color:#fff}
.about-sec::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:rgba(82,183,136,.08)}
.about-sec::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:rgba(200,169,110,.06)}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:36px;position:relative;z-index:1}
.about-item{padding:24px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:all .3s;backdrop-filter:blur(4px)}
.about-item:hover{background:rgba(255,255,255,.08);transform:translateY(-3px)}
.about-icon{font-size:28px;margin-bottom:12px;display:block}
.about-item h4{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px}
.about-item p{font-size:12px;color:rgba(255,255,255,.5);line-height:1.6}

/* Promo */
.promo{border-radius:20px;padding:48px 40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px;color:#fff;background:linear-gradient(135deg,var(--g),#0D1B0E);position:relative;overflow:hidden}
.promo::before{content:'';position:absolute;top:-80px;right:-80px;width:300px;height:300px;border-radius:50%;background:rgba(200,169,110,.1)}
.promo::after{content:'';position:absolute;bottom:-60px;left:-60px;width:220px;height:220px;border-radius:50%;background:rgba(82,183,136,.08)}

/* Testimonial */
.testi{max-width:640px;margin:0 auto;padding:56px 24px;text-align:center}
.testi-qt{font-family:'Playfair Display',serif;font-size:24px;line-height:1.5;color:var(--dk);margin-bottom:24px;font-weight:400;font-style:italic}
.testi-qt::before,.testi-qt::after{content:'"';color:var(--gold);font-size:32px}

/* Footer */
.ft{background:var(--dk);margin-top:64px;padding:48px 24px 16px}
.ft-in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:36px}
.ft h4{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:16px;text-transform:uppercase}
.ft a,.ft button{display:block;font-size:12px;color:rgba(255,255,255,.35);border:none;background:none;cursor:pointer;margin-bottom:8px;padding:0;font-weight:400;transition:color .2s}
.ft a:hover,.ft button:hover{color:rgba(255,255,255,.7)}
.ft-bot{text-align:center;padding:20px 0;margin-top:24px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:rgba(255,255,255,.2);letter-spacing:.5px}

/* Cart Drawer */
.cart-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;backdrop-filter:blur(3px)}
.cart-dr{position:fixed;right:0;top:0;height:100%;width:100%;max-width:420px;background:var(--w);z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(0,0,0,.1)}
.cart-hd{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--bd)}
.ci{display:flex;gap:14px;padding:14px;background:var(--cream);border-radius:14px;margin-bottom:10px}
.ci img{width:60px;height:72px;border-radius:12px;object-fit:cover;flex-shrink:0}
.qc{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--w)}
.qc button{padding:6px 12px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--g)}
.qc span{padding:0 12px;font-size:13px;font-weight:700;min-width:32px;text-align:center}

/* Toast */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-24px);z-index:100;background:var(--dk);color:#fff;padding:14px 28px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.15);font-size:13px;font-weight:600;opacity:0;transition:all .35s;pointer-events:none;letter-spacing:.3px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Product Detail */
.pd{max-width:1100px;margin:0 auto;padding:28px 24px}
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.pd-img{border-radius:20px;overflow:hidden;background:var(--cream);position:relative}
.pd-img img{width:100%;aspect-ratio:3/4;object-fit:cover}
.cd{width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;outline-offset:4px;transition:transform .2s}
.cd:hover{transform:scale(1.1)}
.szb{min-width:44px;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.3px}
.exp-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 0;font-size:14px;font-weight:700;border:none;border-top:1px solid var(--bd);background:none;color:var(--dk);cursor:pointer;text-align:left;transition:color .2s;letter-spacing:.2px}
.exp-btn:hover{color:var(--gm)}

/* Checkout */
.ck-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start;max-width:1100px;margin:0 auto;padding:36px 24px}
.fc{background:var(--w);border:1px solid var(--bd);border-radius:16px;padding:24px;margin-bottom:16px}
.fi{border:2px solid var(--bd);border-radius:12px;padding:12px 16px;font-size:13px;outline:none;background:var(--w);color:var(--dk);width:100%;box-sizing:border-box;transition:border-color .2s;font-weight:500}
.fi:focus{border-color:var(--gm)}
.fi-label{font-size:11px;font-weight:700;color:var(--txl);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.rb{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;text-align:left;color:var(--dk);transition:all .2s;border:2px solid var(--bd);background:var(--w)}
.rb.on{border-color:var(--g);background:var(--gl)}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .2s}
.rb.on .rd{border-color:var(--g)}
.rd i{width:12px;height:12px;border-radius:50%;background:var(--g);display:none}
.rb.on .rd i{display:block}
.sum{background:var(--w);border:2px solid var(--bd);border-radius:16px;padding:24px;position:sticky;top:80px}

/* Admin */
.adm{display:flex;min-height:calc(100vh - 64px);background:var(--bg)}
.aside{width:220px;padding:20px;background:var(--w);border-right:1px solid var(--bd)}
.aside .al{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;margin-bottom:3px;transition:all .2s;color:var(--txl);background:none;letter-spacing:.2px}
.aside .al:hover,.aside .al.on{background:var(--gl);color:var(--g)}
.adm-main{flex:1;padding:28px;overflow-y:auto;padding-bottom:80px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.sc{background:var(--w);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:transform .2s}
.sc:hover{transform:translateY(-2px)}
.sc .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.sc .l{font-size:12px;color:var(--txl);margin-top:4px;font-weight:500}
.chart-bar{display:flex;align-items:flex-end;gap:14px;height:160px;padding:20px 0}
.chart-bar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart-bar .bar{width:100%;border-radius:8px;transition:height .6s cubic-bezier(.16,1,.3,1);background:linear-gradient(to top,var(--g),var(--gm))}
.chart-bar span{font-size:10px;font-weight:600}

/* Modal */
.modal-ov{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.modal{position:relative;width:100%;max-width:520px;background:var(--w);border-radius:20px;padding:28px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.2)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.modal-close{width:36px;height:36px;border-radius:50%;background:var(--cream);border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:var(--bd)}

/* Review */
.rev{padding:16px;border-radius:14px;background:var(--cream);margin-top:10px;border:1px solid var(--bd)}

/* WhatsApp */
.wa{position:fixed;bottom:28px;right:28px;z-index:50;width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(37,211,102,.35);font-size:28px;transition:transform .3s}
.wa:hover{transform:scale(1.12)}

/* Breadcrumb */
.bc{font-size:12px;color:var(--txl);margin-bottom:20px;display:flex;align-items:center;gap:6px;font-weight:500}
.bc button{color:var(--gm);border:none;background:none;cursor:pointer;font-size:12px;font-weight:600}

/* Animate */
.anim{opacity:0;transform:translateY(28px);transition:all .7s cubic-bezier(.16,1,.3,1)}.anim.show{opacity:1;transform:translateY(0)}

/* Appearance Preview */
.app-preview{width:100%;height:120px;border-radius:12px;object-fit:cover;border:2px dashed var(--bd);margin-top:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;color:var(--txl);font-size:13px;overflow:hidden}
.app-preview img{width:100%;height:100%;object-fit:cover}

@media(max-width:768px){
  .hero h1{font-size:32px}
  .hero-visual{flex:0 0 180px}
  .hero-in{padding:32px 16px 48px;gap:24px}
  .hero-btns .btn{padding:10px 18px;font-size:13px}
  .hero-cats{gap:10px;margin-top:20px}
  .cc img{width:44px;height:44px}
  .pd-grid,.ck-grid{grid-template-columns:1fr}
  .nav-links{display:none!important}
  .sb{display:none!important}
  .mob-srch{display:flex!important}
  .mmb{display:flex!important}
  .cgrid{grid-template-columns:1fr 1fr;gap:10px}
  .ccard{aspect-ratio:2/3}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:12px}
  .pcard .nm{font-size:13px}
  .pcard .pr b{font-size:13px}
  .sg{grid-template-columns:repeat(2,1fr)}
  .aside{display:none}
  .mob-admin{display:flex!important}
  .adm-main{padding:16px!important}
  .adm{min-height:auto}
  .ft-in{grid-template-columns:1fr 1fr;gap:20px}
  .about-sec{margin:0 12px;padding:24px 16px;border-radius:14px}
  .about-grid{grid-template-columns:1fr!important}
  .sec{padding:24px 16px}
  .sec-h{font-size:24px}
  .testi-qt{font-size:18px}
  .promo{padding:28px 20px;flex-direction:column;text-align:center}
  .promo h3{font-size:20px!important}
  .sum{position:static!important}
  .cart-dr{max-width:100%}
  .modal{margin:8px;max-height:95vh;border-radius:16px}
  .pd-img img{aspect-ratio:1/1}
  .fl{display:none}
  .pscroll .pcard{width:180px}
  .exp-btn{font-size:13px;padding:12px 0}
  .rev{padding:10px}
  .ann{font-size:9px;padding:8px 12px;letter-spacing:1px}
  .nav-in{height:52px;padding:0 12px}
  .logo b{font-size:20px}
  .ib{padding:6px}
  .btn-sm{padding:6px 12px;font-size:11px}
  .fc{padding:16px}
  .chart-bar{height:120px}
  .wa{bottom:70px;width:48px;height:48px;font-size:22px}
  .mus-btn{bottom:70px;left:16px;width:40px;height:40px;font-size:16px}
  .toast{top:62px;font-size:12px;padding:10px 20px;border-radius:10px}
}
@media(max-width:400px){
  .hero h1{font-size:26px}
  .hero-visual{display:none}
  .pgrid{gap:8px}
  .pcard .nm{font-size:12px}
  .cgrid{gap:8px}
}
/* Music */

async function loadDB(){
  if(!FB)return;try{
    var ps=await db.collection('products').get();
    if(!ps.empty){
      S.products=ps.docs.map(d=>({...d.data(),id:d.id}));
      console.log('✅ Loaded '+ps.size+' products from Firebase');
    }else{
      console.log('📤 Firestore empty — syncing default products...');
      S.products.forEach(function(p){saveDB('products',p.id,p);});
      console.log('✅ '+S.products.length+' products synced to Firebase');
    }
    var os=await db.collection('orders').get();
    if(!os.empty){S.ord=os.docs.map(d=>d.data()).sort(function(a,b){return(b.ts||0)-(a.ts||0);});console.log('✅ Loaded '+os.size+' orders');}
    var cs=await db.collection('coupons').get();
    if(!cs.empty){
      S.cp=cs.docs.map(d=>({...d.data(),id:d.id}));console.log('✅ Loaded '+cs.size+' coupons');
    }else{
      S.cp.forEach(function(c){saveDB('coupons',c.id,c);});
      console.log('✅ Default coupons synced');
    }
    var ts=await db.collection('settings').doc('theme').get();
    if(ts.exists){Object.assign(TH,ts.data());console.log('✅ Loaded theme');}
    R();console.log('🔥 All data loaded from Firebase!');
  }catch(e){console.warn('❌ Load error:',e);}
}

lue,pw=document.getElementById('lg-pw').value;if(${il}){if(e==='admin'&&pw==='jaishreekrishnaji'){S.usr={name:'Admin',email:'admin',role:'admin'};adminAuth();notify('Jai Shree Krishna 🙏 Welcome Admin!');go('admin');}else if(e&&pw){S.usr={name:e.split('@')[0],email:e,role:'customer'};notify('Welcome back!');go('home');}else notify('Please fill all fields');}else{var n=document.getElementById('lg-n')?.value;if(n&&e&&pw){S.usr={name:n,email:e,role:'customer'};notify('Account created! 🎉');go('home');}else notify('Please fill all fields');}">${il?'Sign In →':'Create Account →'}</button></div></div></div></div>`;}

<span style="color:var(--g);font-weight:700">✅ Done!</span> Your store data will now persist across sessions and devices.
</div></div>`;}

return`<div class="adm"><aside class="aside"><div style="font-size:9px;letter-spacing:4px;font-weight:800;color:var(--g);margin-bottom:24px;padding-left:10px">ADMIN</div>${[['admin','📊','Dashboard'],['a-p','📦','Products'],['a-o','📋','Orders'],['a-c','🏷️','Coupons'],['a-t','🎨','Appearance'],['a-pay','💳','Payments'],['a-f','🔥','Firebase']].map(([p,ic,l])=>`<button class="al ${S.pg===p?'on':''}" onclick="go('${p}')">${ic} ${l}</button>`).join('')}<div style="border-top:1px solid var(--bd);margin-top:16px;padding-top:16px"><button class="al" onclick="go('home')">🏪 View Store</button><button class="al" onclick="logout()" style="color:var(--red)">↩ Logout</button></div></aside><main class="adm-main">${main}</main></div>`;}

// MODALS
function modals(){const m=window._modal;if(!m)return'';
if(m==='prod'){const ep=window._ep;const imgs=ep&&ep.imgs?ep.imgs:[];const szList=ep?ep.sz:['S','M','L','XL'];const stkMap=ep&&ep.stk?ep.stk:{};return`<div class="modal-ov"><div class="modal"><div class="modal-hd"><b class="pf" style="font-size:22px">${ep?'Edit':'Add New'} Product</b><button class="modal-close" onclick="window._modal=null;R()">✕</button></div><div style="display:flex;flex-direction:column;gap:14px">
<div><label class="fi-label">Product Name *</label><input id="mp-n" class="fi" placeholder="e.g. Classic Noir Hoodie" value="${ep?ep.n:''}"></div>
<div style="background:var(--cream);border:1px solid var(--bd);border-radius:12px;padding:16px"><label class="fi-label">📸 Product Images (paste URLs, one per line)</label><textarea id="mp-imgs" class="fi" rows="4" style="resize:none;margin-top:6px" placeholder="https://example.com/front.jpg&#10;https://example.com/back.jpg&#10;https://example.com/detail.jpg">${ep?(ep.imgs||[ep.img]).join('\n'):''}</textarea>
<div id="mp-img-preview" style="display:flex;gap:8px;margin-top:10px;overflow-x:auto">${(ep?(ep.imgs||[ep.img]):[]).map(u=>'<img src="'+u+'" style="width:60px;height:72px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--bd)">').join('')}</div>
<p style="font-size:11px;color:var(--txl);margin-top:6px">First image = main product image. Add up to 6 images.</p></div>
<div><label class="fi-label">🎬 Product Video URL (optional)</label><input id="mp-vid" class="fi" placeholder="https://example.com/video.mp4" value="${ep&&ep.vid?ep.vid:''}"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="fi-label">Selling Price (₹) *</label><input id="mp-p" class="fi" type="number" placeholder="1299" value="${ep?ep.p:''}"></div><div><label class="fi-label">MRP (₹) *</label><input id="mp-m" class="fi" type="number" placeholder="2499" value="${ep?ep.m:''}"></div></div>
<div><label class="fi-label">Category *</label><select id="mp-c" class="fi"><option value="men"${ep&&ep.c==='men'?' selected':''}>Men's</option><option value="women"${ep&&ep.c==='women'?' selected':''}>Women's</option><option value="kids"${ep&&ep.c==='kids'?' selected':''}>Kids</option></select></div>
<div><label class="fi-label">Available Sizes (comma separated)</label><input id="mp-sz" class="fi" placeholder="S, M, L, XL, XXL" value="${szList.join(', ')}"></div>
<div style="background:var(--cream);border:1px solid var(--bd);border-radius:12px;padding:16px"><label class="fi-label">📦 Stock Per Size</label><p style="font-size:11px;color:var(--txl);margin-bottom:10px">Enter quantity for each size</p><div id="mp-stk" style="display:flex;flex-wrap:wrap;gap:8px">${szList.map(s=>'<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="font-size:11px;font-weight:700;color:var(--g)">'+s+'</span><input class="fi" type="number" data-sz="'+s+'" style="width:60px;text-align:center;padding:8px 4px" placeholder="0" value="'+(stkMap[s]||ep&&ep.st?Math.round((ep?.st||50)/szList.length):'')+'"></div>').join('')}</div></div>
<div><label class="fi-label">Description</label><textarea id="mp-d" class="fi" rows="3" style="resize:none" placeholder="Describe your product...">${ep?ep.d:''}</textarea></div>
<div><label class="fi-label">Specifications</label><input id="mp-sp" class="fi" placeholder="Material · Weight · Fit type" value="${ep?ep.sp:''}"></div>
<button class="btn btn-g" style="width:100%;justify-content:center;padding:14px 0;margin-top:4px;font-size:15px;border-radius:14px" onclick="saveProd()">${ep?"Update Product":"Add Product"}</button></div></div></div>`;}

if(m==='coup'){return`<div class="modal-ov"><div class="modal" style="max-width:420px"><div class="modal-hd"><b class="pf" style="font-size:22px">Create Coupon</b><button class="modal-close" onclick="window._modal=null;R()">✕</button></div><div style="display:flex;flex-direction:column;gap:14px"><div><label class="fi-label">Coupon Code *</label><input id="mc-cd" class="fi" placeholder="e.g. SUMMER20" style="text-transform:uppercase;letter-spacing:2px;font-weight:700"></div><div><label class="fi-label">Discount Type *</label><select id="mc-tp" class="fi"><option value="p">Percentage Off (%)</option><option value="f">Flat Amount Off (₹)</option></select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="fi-label">Discount Value *</label><input id="mc-v" class="fi" type="number" placeholder="10"></div><div><label class="fi-label">Minimum Order (₹) *</label><input id="mc-mn" class="fi" type="number" placeholder="999"></div></div><button class="btn btn-g" style="width:100%;justify-content:center;padding:14px 0;font-size:15px;border-radius:14px" onclick="saveCoup()">Create Coupon</button></div></div></div>`;}
return'';}

// FOOTER
function footer(){if(S.pg.startsWith('a')||S.pg==='admin')return'';return`<footer class="ft"><div class="ft-in"><div><span class="pf" style="font-size:22px;color:#fff;letter-spacing:2px">SHAHI</span><span style="font-size:7px;letter-spacing:5px;margin-left:5px;color:var(--gold);font-weight:800">HOODIES</span><p style="font-size:12px;color:rgba(255,255,255,.3);margin-top:12px;line-height:1.7;max-width:240px">Premium hoodies crafted with love in Ludhiana, India. Comfort meets style.</p><div style="display:flex;gap:6px;margin-top:16px">${['UPI','VISA','MC','RuPay','COD'].map(b=>`<span style="font-size:8px;font-weight:700;padding:4px 8px;border:1px solid rgba(255,255,255,.1);border-radius:5px;color:rgba(255,255,255,.3)">${b}</span>`).join('')}</div></div><div><h4>Shop</h4>${[['All Hoodies','shop'],["Men's",'shop'],["Women's",'shop'],['Kids','shop']].map(([l,p])=>`<button onclick="go('${p}')">${l}</button>`).join('')}</div><div><h4>Support</h4>${[['Track Order','track'],['FAQs','faq'],['Contact Us','contact'],['Size Guide','faq']].map(([l,p])=>`<button onclick="go('${p}')">${l}</button>`).join('')}</div><div><h4>Policies</h4>${[['Privacy Policy','privacy'],['Terms','terms'],['Returns','returns'],['Shipping','shippg']].map(([l,p])=>`<button onclick="go('${p}')">${l}</button>`).join('')}</div></div><div class="ft-bot">© 2026 SHAHI HOODIES Pvt Ltd · Made with ♥ in India · All Rights Reserved</div></footer>`;}

// RENDER
function R(){let pg='';switch(S.pg){case'home':pg=home();break;case'shop':pg=shop();break;case'product':pg=product();break;case'checkout':pg=checkout();break;case'done':pg=done();break;case'login':pg=login();break;case'orders':pg=orders();break;case'track':pg=track();break;case'wishlist':pg=wishlist();break;case'admin':case'a-p':case'a-o':case'a-c':case'a-t':case'a-pay':case'a-f':pg=admin();break;case'privacy':pg=legal('Privacy Policy',LG.privacy);break;case'terms':pg=legal('Terms',LG.terms);break;case'returns':pg=legal('Returns',LG.returns);break;case'shippg':pg=legal('Shipping',LG.shipping);break;case'contact':pg=legal('Contact Us',LG.contact);break;case'faq':pg=legal('FAQs',LG.faq);break;default:pg=home();}
document.getElementById('app').innerHTML=nav()+`<div class="toast ${S.ts?'show':''}">✅ ${S.ts}</div>`+cart()+pg+footer()+modals()+`<a href="https://wa.me/919876543210" target="_blank" class="wa">💬</a>`+(TH.bgMusic?`<audio id="bg-audio" src="${TH.bgMusic}" loop preload="auto"></audio><button class="mus-btn ${_mp?'playing':''}" onclick="toggleMusic()" title="${_mp?'Pause Music':'Play Music'}">${_mp?'🎵':'🔇'}</button>`:'');
setTimeout(()=>document.querySelectorAll('.anim').forEach(el=>el.classList.add('show')),100);}
R();
function tryFB(n){if(typeof firebase!=='undefined'){initFB();}else if(n<20){setTimeout(function(){tryFB(n+1);},500);}}
setTimeout(function(){tryFB(0);},300);
</script>
</body>
</html>
